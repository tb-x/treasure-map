<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Map</title>
<meta name="theme-color" content="#2b6f8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treasure Map">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<style>
  /* Layout: maker mode is a settings card above a column of A4 sheet previews (each prints as one wordless page: board, arrow-and-sum cards, answer QR); answer mode (the QR's #n=…&m=… link) is the same sheet solved: the path drawn to the treasure, every box filled in, the cards below the board or beside it on wide screens; tapping a chest opens a full-screen reward. */
  :root{
    --ink:#1f2a44; --sea:#2b6f8f; --sand:#f6ecd2; --sand-dark:#e3cf9f; --brown:#8a6a3a; --trail:#7d879c;
    --go:#2fa34a; --gold:#f2b632; --red:#e0533d;
    --read:Verdana,Tahoma,sans-serif;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --z:1;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--sea);color:var(--ink);font-family:var(--read);-webkit-tap-highlight-color:transparent;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  button,input,select{font:inherit;color:inherit;touch-action:manipulation}
  button{cursor:pointer}

  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- maker ---------- */
  #maker{max-width:860px;margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
            calc(28px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  header{padding-left:56px;min-height:44px;color:#fff}
  h1{font-family:var(--title);font-weight:400;font-size:clamp(30px,6vw,42px);letter-spacing:1px;line-height:1.1;margin:0;
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  header p{margin:6px 0 0;font-size:14px;line-height:1.45;opacity:.92}
  #controls{margin:16px 0 22px;background:var(--sand);border-radius:16px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px 14px}
  #controls label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold}
  #controls input,#controls select{height:44px;width:100%;border:2px solid var(--sand-dark);border-radius:10px;background:#fff;
    padding:0 10px;font-size:16px}
  #controls .lens{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold}
  #controls .chips{display:flex;gap:6px}
  #controls .chips label{flex:1;position:relative}
  #controls .chips input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  #controls .chips span{display:grid;place-items:center;height:44px;border:2px solid var(--sand-dark);border-radius:10px;background:#fff;font-size:16px}
  #controls .chips input:checked+span{background:var(--sea);border-color:var(--sea);color:#fff}
  #controls .chips input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
  .btns{grid-column:1/-1;display:flex;gap:10px}
  .btns button{flex:1;height:54px;border:0;border-radius:14px;color:#fff;font-family:var(--title);font-size:24px;letter-spacing:1px;
    padding-top:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #new{background:var(--red)}
  #print{background:var(--go)}

  #pages{display:flex;flex-direction:column;align-items:center;gap:22px}
  .page{position:relative}
  .reroll{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--sand);
    box-shadow:0 3px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
  .reroll svg{width:24px;height:24px}

  /* one printed A4 page; all sizes in mm so the preview is the print. --z shrinks the preview to fit a phone. */
  .sheet{zoom:var(--z);width:210mm;height:296.5mm;padding:12mm;background:#fff;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;gap:8mm;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .top{display:flex;gap:6mm;align-items:flex-end}
  .board{width:150mm;height:150mm;flex:none;display:block}
  .board .cells{fill:#fff}
  .board .l1,.board .l5{stroke:var(--ink);stroke-width:.3}
  .board .l5{stroke-width:.75}
  .board .lbl{font:bold 4.6px Verdana,Tahoma,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
  .go circle{fill:var(--go)}
  .go path{fill:#fff}
  .key{width:30mm;flex:none;display:flex;flex-direction:column;align-items:center;gap:3mm;color:inherit;text-decoration:none}
  .key .chest{width:15mm;height:15mm}
  .key .qr{width:30mm;height:30mm;display:block}
  .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm}
  .step{border:.5mm solid var(--ink);border-radius:3mm;padding:2mm;display:flex;flex-direction:column;align-items:center;gap:2mm}
  .step .sum{font-size:13pt;font-weight:bold;white-space:nowrap}
  .step .sum.long{font-size:10.5pt}
  .step .sum.xlong{font-size:9pt}
  .step .row{display:flex;align-items:center;gap:3mm}
  .step .arr{width:11mm;height:11mm;fill:var(--ink)}
  .step .box{width:11mm;height:11mm;border:.5mm solid var(--ink);border-radius:2mm}
  .steps.big .step{padding:3mm 2mm}                  /* up to 8 moves: two rows, so there's room for bigger cards */
  .steps.big .sum{font-size:14pt}
  .steps.big .sum.long{font-size:10.5pt}
  .steps.big .sum.xlong{font-size:9pt}
  .steps.big .arr,.steps.big .box{width:15mm;height:15mm}
  .sheet.tight .board{width:142mm;height:142mm}        /* 13+ moves: four rows of cards, so the board gives a little room */

  /* the order to follow: numbered cards on a dotted trail from a start dot (like the board's) to the chest */
  .sheet .steps{column-gap:4mm;row-gap:7mm}
  .sheet .step{position:relative;background:#fff;padding-top:3.6mm}      /* the sum sits below the number badge */
  .sheet .step .no{position:absolute;top:-2.8mm;left:-2.8mm;width:6.4mm;height:6.4mm;border-radius:50%;background:var(--ink);color:#fff;
    font:bold 9pt/6.4mm Verdana,Tahoma,sans-serif;text-align:center}
  .sheet .step::after,.sheet .step.first::before,.sheet .step.bol::before{content:'';position:absolute;box-sizing:border-box;
    border:0 dotted var(--trail)}
  .sheet .step.next::after{left:100%;top:50%;width:5mm;border-top-width:.8mm}
  .sheet .step.last::after{left:100%;top:50%;width:3mm;border-top-width:.8mm}
  .sheet .step.first::before{right:100%;top:50%;width:3mm;border-top-width:.8mm}
  .sheet .step.eol::after{left:50%;top:100%;height:4mm;border-left-width:.8mm}
  .sheet .step.bol::before{left:50%;bottom:100%;height:4mm;width:calc(300% + 15mm);border-top-width:.8mm;border-left-width:.8mm}
  .sheet .start,.sheet .end{position:absolute;top:50%;transform:translateY(-50%)}
  .sheet .start{right:calc(100% + 3mm);width:7mm;height:7mm}
  .sheet .end{left:calc(100% + 3mm);width:8mm;height:8mm}
  .sheet .start svg,.sheet .end svg{width:100%;height:100%;display:block}

  /* ---------- answer ---------- */
  #answer{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:calc(64px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
            calc(16px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  .solved{width:min(100%,640px);background:#fff;border-radius:14px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.2);
    display:flex;flex-direction:column;gap:14px}
  .solved .board{width:100%;height:auto;aspect-ratio:1}
  .solved .spot{fill:var(--gold)}
  .solved .path{fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .solved .head{fill:var(--red)}
  .solved g.no circle{fill:var(--red);stroke:#fff;stroke-width:.6}
  .solved g.no text{fill:#fff;font:bold 3.4px Verdana,Tahoma,sans-serif;text-anchor:middle;dominant-baseline:central}
  .solved .step{position:relative}
  .solved span.no{position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;
    font:bold 12px/22px Verdana,Tahoma,sans-serif;text-align:center;border:2px solid #fff}
  .side{display:flex;flex-direction:column;align-items:center;gap:12px}
  .found{display:flex;align-items:center;gap:10px;font-family:var(--title);font-size:44px;line-height:1;padding:4px 8px 0;
    border:0;background:none;color:inherit;touch-action:manipulation}
  .found svg{width:1.3em;height:1.3em;transform-origin:50% 90%;animation:wiggle 2.4s ease-in-out infinite}
  @keyframes wiggle{0%,70%,100%{transform:none}76%{transform:rotate(-9deg)}82%{transform:rotate(8deg)}88%{transform:rotate(-5deg)}94%{transform:rotate(3deg)}}
  .solved .treasure{cursor:pointer}

  /* reward: a tapped chest opens full screen, rattles, flips its lid and something pops out */
  #reward{position:fixed;inset:0;z-index:60;background:rgba(16,36,56,.84);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1vmin;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #reward .rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;opacity:0;
    background:repeating-conic-gradient(rgba(242,182,50,.32) 0 10deg,transparent 10deg 20deg);
    -webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent);transition:opacity .4s}
  #reward.open .rays{opacity:1;animation:spin 16s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  #reward .gift{position:relative;display:flex;flex-direction:column;align-items:center;gap:1vmin}
  #reward .emoji{font-size:24vmin;line-height:1.1;opacity:0}
  #reward .name{font-family:var(--title);font-size:clamp(28px,7vmin,56px);letter-spacing:1px;color:#fff;text-align:center;
    text-shadow:0 4px 0 rgba(0,0,0,.3);padding:0 16px;opacity:0}
  #reward.open .emoji{animation:rise .7s .1s cubic-bezier(.3,1.6,.5,1) forwards}
  #reward.open .name{opacity:1;transition:opacity .3s .55s}
  @keyframes rise{from{transform:translateY(22vmin) scale(.2);opacity:0}to{transform:none;opacity:1}}
  #reward .bigchest{position:relative;width:min(46vmin,300px);height:auto;overflow:visible}
  #reward.shake .bigchest{animation:shake .5s ease-in-out}
  @keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
  #reward .lid{transform-box:view-box;transform-origin:2px 11px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
  #reward.open .lid{transform:translate(-1px,-4px) rotate(-24deg)}
  #reward .bit{position:absolute;left:calc(50% - 3vmin);top:55%;font-size:6vmin;line-height:1;pointer-events:none;
    animation:fly 1.2s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
  @media (prefers-reduced-motion: reduce){ .found svg,#reward.open .rays{animation:none} }
  .solved .steps{width:100%;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .solved .step{border-width:2px;border-radius:10px;padding:8px 4px;gap:6px}
  .solved .sum{font-size:15px}
  .solved .sum.long{font-size:12px}
  .solved .sum.xlong{font-size:11px}
  .solved .arr,.solved .box{width:36px;height:36px}
  .solved .box{border-width:2px;border-radius:6px;display:grid;place-items:center;font:bold 22px Verdana,Tahoma,sans-serif;color:var(--red)}
  #make{color:var(--sea);font-size:13px}
  @media (min-aspect-ratio: 5/4){
    #answer{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:calc(64px + env(safe-area-inset-left,0px))}
    .solved{width:auto;flex-direction:row;align-items:flex-start}
    .solved .board{width:min(54vw,calc(100dvh - 56px))}
    .side{width:min(36vw,460px)}
  }

  body.answering #maker, body:not(.answering) #answer{display:none}

  /* ---------- print: only the sheets, one per page ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    #home,#maker>header,#controls,.reroll,#answer{display:none!important}
    #maker{padding:0;max-width:none}
    #pages{display:block}
    .sheet{zoom:1!important;box-shadow:none}
    .page:not(:last-child){break-after:page}
  }
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>

<main id="maker">
  <header>
    <h1>Treasure Map</h1>
    <p>Print a map. Your child solves each sum to find how many squares to go in the arrow's direction, starting at the green dot. Scan the QR code to check where the treasure is.</p>
  </header>
  <form id="controls" onsubmit="return false">
    <label>Board size <input id="size" type="number" inputmode="numeric"></label>
    <label>Moves <input id="moves" type="number" inputmode="numeric"></label>
    <label>Biggest number <input id="maxNum" type="number" inputmode="numeric"></label>
    <div class="lens" role="group" aria-labelledby="lens-label"><span id="lens-label">Numbers in a sum</span>
      <span class="chips" id="lengths">
        <label title="like 5 − 3"><input type="checkbox" value="2"><span>2</span></label>
        <label title="like 7 + 8 − 11"><input type="checkbox" value="3"><span>3</span></label>
        <label title="like 5 + 4 − 3 + 1"><input type="checkbox" value="4"><span>4</span></label>
      </span>
    </div>
    <label>Start corner
      <select id="corner"><option value="random">Any corner</option><option value="bl">Bottom left</option><option value="br">Bottom right</option><option value="tl">Top left</option><option value="tr">Top right</option></select>
    </label>
    <label>Sheets <input id="sheets" type="number" inputmode="numeric"></label>
    <div class="btns"><button id="new" type="button">New maps</button><button id="print" type="button">Print</button></div>
  </form>
  <div id="pages"></div>
</main>

<main id="answer"><div id="solved" class="solved"></div></main>
<div id="reward" hidden>
  <div class="rays"></div>
  <div class="gift"><span class="emoji"></span><span class="name"></span></div>
  <svg class="bigchest" viewBox="-2 -10 28 33" aria-hidden="true"></svg>
</div>

<script>
/* ======== tuning ======== */
const DEFAULTS = { size: 10, moves: 8, maxNum: 20, lengths: [2, 3, 4], corner: 'random', sheets: 1 };
const SIZE_MIN = 5, SIZE_MAX = 15;          // board is size × size squares
const MOVES_MIN = 3, MOVES_MAX = 16;        // 16 cards still fit under the board on A4
const MAXNUM_MIN = 5, MAXNUM_MAX = 50;      // biggest number in a sum, and in every partial result
const SHEETS_MAX = 20;
const LENGTHS = [2, 3, 4];                  // how many numbers a sum can have; each sum picks one of the ticked ones, equally often
const COLS = 4;                             // cards per printed row (the dotted trail's CSS assumes 4)
const SAME_DIR_WEIGHT = 0.35;               // how likely the next arrow repeats the last one (1 = as likely as a turn)
const BACK_DIR_WEIGHT = 0.6;                // how likely it points straight back
const MIN_TREASURE_DIST = 3;                // squares (across + down) between the start and the treasure
const PUBLIC_URL = 'https://tb-x.github.io/treasure-map/';   // where the QR points when the maker isn't on GitHub Pages
const REWARDS = [                           // answer page: what pops out of the chest, a different one each time it's opened
  ['👑', 'A golden crown!'], ['💎', 'A giant diamond!'], ['🪙', 'Pirate gold!'], ['🦖', 'A baby T. rex!'],
  ['🦄', 'A unicorn!'], ['🐉', 'A friendly dragon!'], ['🚀', 'A real rocket!'], ['🦜', 'A pirate parrot!'],
  ['🍦', 'A giant ice cream!'], ['🧁', 'A magic cupcake!'], ['🏆', 'A champion cup!'], ['🪄', 'A magic wand!'],
  ['🧸', 'A cuddly teddy!'], ['🐙', 'A tickly octopus!'], ['🎈', 'Lots of balloons!'], ['🐢', 'A sea turtle friend!'],
  ['🍕', 'A whole pizza!'], ['🔮', 'A crystal ball!'], ['🐱', 'A pirate kitten!'], ['🧦', 'One smelly sock!'],
];
const BITS = ['🪙', '✨', '⭐', '💎'];       // what bursts out around it
const CHEST_SHAKE_MS = 500;                 // the chest rattles this long before it opens
const ARROW_GAP = 5.2;                      // answer page: how far short of the treasure's centre the line's arrowhead stops (a square is 10)

/* ======== small helpers ======== */
const $ = (id) => document.getElementById(id);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const BACK = { U: 'D', D: 'U', L: 'R', R: 'L' };
const ROT = { U: 0, R: 90, D: 180, L: 270 };
const MINUS = '−';
const cellName = ([x, y]) => LETTERS[x] + (y + 1);

const arrowSvg = (d) => `<svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 22.5 12H16v10.5H8V12H1.5z" transform="rotate(${ROT[d]} 12 12)"/></svg>`;
const CHEST_LID = `<path d="M2 11V8.5Q2 3 12 3T22 8.5V11z" fill="#c07a3a" stroke="#5b3413" stroke-width="1.2" stroke-linejoin="round"/>`;
const CHEST_BODY = `<rect x="2" y="10" width="20" height="11" rx="1.5" fill="#a0612b" stroke="#5b3413" stroke-width="1.2"/>
  <rect x="2" y="10" width="20" height="2.4" fill="#f2b632" stroke="#5b3413" stroke-width=".8"/>
  <rect x="10" y="9" width="4" height="5.5" rx="1" fill="#f2b632" stroke="#5b3413" stroke-width=".8"/>`;
const CHEST = CHEST_LID + CHEST_BODY;
const chestSvg = (cls) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${CHEST}</svg>`;

/* ======== settings (remembered per browser) ======== */
const KEY = 'treasuremap.settings';
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { /* blocked on file:// */ }
const cleanLengths = (a) => { const l = LENGTHS.filter((n) => Array.isArray(a) && a.includes(n)); return l.length ? l : DEFAULTS.lengths.slice(); };
settings.lengths = cleanLengths(settings.lengths);
delete settings.longer;   // the old Never / Sometimes / Often setting
const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch { /* ignore */ } };
const clamp = (v, a, b, d) => (Number.isFinite(+v) && v !== '' ? Math.min(b, Math.max(a, Math.round(+v))) : d);

/* ======== riddle: path and sums ======== */
function cornerXY(corner, n) {
  const c = corner === 'random' ? ['tl', 'tr', 'bl', 'br'][rint(0, 3)] : corner;
  return [c[1] === 'l' ? 0 : n - 1, c[0] === 't' ? 0 : n - 1];
}

function makePath(n, corner, moves, maxStep) {
  for (let tries = 0; tries < 1000; tries++) {
    const start = cornerXY(corner, n);
    let [x, y] = start, prev = null, ok = true;
    const steps = [];
    for (let i = 0; i < moves && ok; i++) {
      const opts = [];
      for (const d of 'UDLR') {
        const room = d === 'U' ? y : d === 'D' ? n - 1 - y : d === 'L' ? x : n - 1 - x;
        const lim = Math.min(room, maxStep);
        if (lim < 1) continue;
        const w = !prev ? 1 : d === prev.d ? SAME_DIR_WEIGHT : d === BACK[prev.d] ? BACK_DIR_WEIGHT : 1;
        opts.push({ d, lim, w });
      }
      let r = Math.random() * opts.reduce((s, o) => s + o.w, 0), o = opts[0];
      for (const c of opts) { if ((r -= c.w) < 0) { o = c; break; } }
      let k = rint(1, o.lim);
      if (prev && o.d === BACK[prev.d] && k === prev.k) {   // don't just undo the last move
        if (o.lim === 1) { ok = false; break; }
        k = k === o.lim ? k - 1 : k + 1;
      }
      x += DIRS[o.d][0] * k; y += DIRS[o.d][1] * k;
      prev = { d: o.d, k };
      steps.push(prev);
    }
    if (ok && Math.abs(x - start[0]) + Math.abs(y - start[1]) >= MIN_TREASURE_DIST) return { n, start, steps, end: [x, y] };
  }
  return null;
}

// a sum is a list of terms (negative = take away) whose total is v; every partial total stays within 0..max
function shortSum(v, max) {
  const canAdd = v >= 2, canSub = v + 1 <= max;
  if (canSub && (!canAdd || Math.random() < 0.55)) { const a = rint(v + 1, max); return [a, -(a - v)]; }
  const a = rint(1, v - 1); return [a, v - a];
}
function longSum(v, max, k) {
  for (let t = 0; t < 60; t++) {
    const terms = [rint(1, max)];
    let tot = terms[0];
    for (let i = 1; i < k - 1; i++) {
      if ((Math.random() < 0.5 && tot < max) || tot < 2) { const b = rint(1, max - tot); terms.push(b); tot += b; }
      else { const b = rint(1, tot - 1); terms.push(-b); tot -= b; }
    }
    const last = v - tot;
    if (last === 0 || Math.abs(last) > max) continue;
    terms.push(last);
    return terms;
  }
  return null;
}
// pick one of the allowed lengths at random; if no sum of that length fits, try the others
function makeSum(v, max, lengths) {
  const first = lengths[rint(0, lengths.length - 1)];
  for (const k of [first, ...lengths.filter((x) => x !== first)]) {
    const terms = k === 2 ? shortSum(v, max) : longSum(v, max, k);
    if (terms) return terms;
  }
  return shortSum(v, max);
}
const sumText = (terms) => terms.map((t, i) => (i ? (t < 0 ? ` ${MINUS} ` : ' + ') + Math.abs(t) : String(t))).join('');

function makeRiddle(s) {
  const path = makePath(s.size, s.corner, s.moves, Math.min(s.size - 1, s.maxNum));
  path.sums = path.steps.map((st) => makeSum(st.k, s.maxNum, s.lengths));
  return path;
}

/* ======== link in the QR code ======== */
// #n=10&s=0.9&m=U5-3,R7+8-11,… : board size, start square (x.y), then each card's arrow and sum
const sumCode = (terms) => terms.map((t, i) => (i ? (t < 0 ? '-' : '+') + Math.abs(t) : String(t))).join('');
const riddleHash = (r) => `#n=${r.n}&s=${r.start[0]}.${r.start[1]}&m=${r.steps.map((s, i) => s.d + sumCode(r.sums[i])).join(',')}`;
const answerBase = () => (location.hostname.endsWith('github.io') ? location.origin + location.pathname : PUBLIC_URL);

function parseHash() {
  const p = {};
  try {
    for (const kv of location.hash.slice(1).split('&')) {
      const i = kv.indexOf('=');
      if (i > 0) p[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    }
  } catch { return null; }
  const n = +p.n, s = (p.s || '').split('.').map(Number), m = p.m || '';
  let steps = [], sums = null;
  if (m.includes(',')) {
    sums = [];
    for (const part of m.split(',')) {
      const mm = /^([UDLR])(\d+(?:[+-]\d+)*)$/.exec(part);
      if (!mm) return null;
      const terms = mm[2].match(/[+-]?\d+/g).map(Number);
      sums.push(terms);
      steps.push({ d: mm[1], k: terms.reduce((a, b) => a + b, 0) });
    }
  } else {   // the first links (15 Oct 2026) held only arrows and answers: U2R4…
    steps = [...m.matchAll(/([UDLR])(\d+)/g)].map((x) => ({ d: x[1], k: +x[2] }));
  }
  if (!(n >= SIZE_MIN && n <= SIZE_MAX) || s.length !== 2 || !steps.length) return null;
  let [x, y] = s;
  for (const st of [{ d: 'U', k: 0 }, ...steps]) {
    if (st.k < 0) return null;
    x += DIRS[st.d][0] * st.k; y += DIRS[st.d][1] * st.k;
    if (!(x >= 0 && y >= 0 && x < n && y < n)) return null;
  }
  return { n, start: s, steps, sums, end: [x, y] };
}

function qrSvg(text) {
  if (typeof qrcode !== 'function') return '<svg class="qr" viewBox="0 0 10 10"></svg>';   // library didn't load
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  const n = q.getModuleCount(), pad = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  return `<svg class="qr" viewBox="0 0 ${n + 2 * pad} ${n + 2 * pad}" shape-rendering="crispEdges" aria-hidden="true">
    <rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* ======== board picture (shared by the sheet and the answer page) ======== */
const M = 8;                                   // label margin, in board units (a square is 10)
const cx = (x) => M + x * 10 + 5;
function boardSvg(n, start, cls, extra = '') {
  const W = M + n * 10 + 1;
  let s = `<svg class="${cls}" viewBox="0 0 ${W} ${W}" aria-hidden="true">`;
  s += `<rect class="cells" x="${M}" y="${M}" width="${n * 10}" height="${n * 10}"/>`;
  for (let i = 0; i < n; i++) {
    s += `<text class="lbl" x="${cx(i)}" y="${M / 2}">${LETTERS[i]}</text>`;
    s += `<text class="lbl" x="${M / 2}" y="${cx(i)}">${i + 1}</text>`;
  }
  for (let i = 0; i <= n; i++) {
    const c = i % 5 === 0 || i === n ? 'l5' : 'l1', p = M + i * 10;
    s += `<line class="${c}" x1="${M}" y1="${p}" x2="${M + n * 10}" y2="${p}"/><line class="${c}" x1="${p}" y1="${M}" x2="${p}" y2="${M + n * 10}"/>`;
  }
  s += `<g class="go" transform="translate(${cx(start[0])} ${cx(start[1])})"><circle r="3.9"/><path d="M-1.3-2.3 2.5 0-1.3 2.3z"/></g>`;
  return s + extra + '</svg>';
}

/* ======== maker: sheets ======== */
let riddles = [];

// one arrow card with its number; the answer page fills the box in
function stepCard(st, terms, { answer = '', no = '', cls = '', extra = '' } = {}) {
  const t = terms ? sumText(terms) + ' =' : '';
  return `<li class="step ${cls}">${extra}${no ? `<span class="no">${no}</span>` : ''}${t ? `<span class="sum${t.length > 17 ? ' long xlong' : t.length > 14 ? ' long' : ''}">${t}</span>` : ''}
    <span class="row">${arrowSvg(st.d)}<span class="box">${answer}</span></span></li>`;
}

const START_DOT = '<svg viewBox="-5 -5 10 10"><circle r="4.6" fill="#2fa34a"/><path d="M-1.6-2.7 3 0-1.6 2.7z" fill="#fff"/></svg>';

// the printed cards are numbered and strung on a dotted trail: from a green dot like the board's start, card to
// card along each row, down and back to the next row, and on to a chest after the last card
function sheetHtml(r) {
  const n = r.steps.length;
  const cards = r.steps.map((st, i) => {
    const last = i === n - 1;
    const cls = [i === 0 ? 'first' : '', last ? 'last' : i % COLS === COLS - 1 ? 'eol' : 'next', i > 0 && i % COLS === 0 ? 'bol' : '']
      .filter(Boolean).join(' ');
    const extra = (i === 0 ? `<span class="start">${START_DOT}</span>` : '') + (last ? `<span class="end">${chestSvg('')}</span>` : '');
    return stepCard(st, r.sums[i], { no: i + 1, cls, extra });
  }).join('');
  const hash = riddleHash(r);
  return `<div class="sheet${Math.ceil(n / COLS) >= 4 ? ' tight' : ''}">
    <div class="top">${boardSvg(r.n, r.start, 'board')}
      <a class="key" href="${hash}" target="_blank" title="Answer: ${cellName(r.end)}">${chestSvg('chest')}${qrSvg(answerBase() + hash)}</a>
    </div>
    <ol class="steps${r.steps.length <= 8 ? ' big' : ''}">${cards}</ol>
  </div>`;
}

function renderPages() {
  $('pages').innerHTML = riddles.map((r, i) => `<div class="page">${sheetHtml(r)}
    <button class="reroll" data-i="${i}" aria-label="New map for this sheet" title="New map for this sheet"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v6h-6" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`).join('');
  fitPages();
}

// shrink the A4 previews to the screen width (print resets the zoom)
function fitPages() {
  const sheetPx = 210 * 96 / 25.4;
  document.documentElement.style.setProperty('--z', Math.min(1, $('pages').clientWidth / sheetPx).toFixed(3));
}

function readControls() {
  settings = {
    size: clamp($('size').value, SIZE_MIN, SIZE_MAX, DEFAULTS.size),
    moves: clamp($('moves').value, MOVES_MIN, MOVES_MAX, DEFAULTS.moves),
    maxNum: clamp($('maxNum').value, MAXNUM_MIN, MAXNUM_MAX, DEFAULTS.maxNum),
    lengths: cleanLengths([...document.querySelectorAll('#lengths input:checked')].map((c) => +c.value)),
    corner: $('corner').value,
    sheets: clamp($('sheets').value, 1, SHEETS_MAX, DEFAULTS.sheets),
  };
  writeControls();
  saveSettings();
}
function writeControls() {
  for (const k of ['size', 'moves', 'maxNum', 'corner', 'sheets']) $(k).value = settings[k];
  for (const c of document.querySelectorAll('#lengths input')) c.checked = settings.lengths.includes(+c.value);
  $('size').min = SIZE_MIN; $('size').max = SIZE_MAX;
  $('moves').min = MOVES_MIN; $('moves').max = MOVES_MAX;
  $('maxNum').min = MAXNUM_MIN; $('maxNum').max = MAXNUM_MAX;
  $('sheets').min = 1; $('sheets').max = SHEETS_MAX;
}

function newAll() { riddles = Array.from({ length: settings.sheets }, () => makeRiddle(settings)); renderPages(); }

function startMaker() {
  writeControls();
  for (const k of ['size', 'moves', 'maxNum', 'corner']) $(k).addEventListener('change', () => { readControls(); newAll(); });
  for (const c of document.querySelectorAll('#lengths input')) {
    c.addEventListener('change', () => {
      if (!document.querySelector('#lengths input:checked')) c.checked = true;   // at least one length stays ticked
      readControls(); newAll();
    });
  }
  $('sheets').addEventListener('change', () => {   // keep the maps already made, add or drop at the end
    readControls();
    riddles = riddles.slice(0, settings.sheets);
    while (riddles.length < settings.sheets) riddles.push(makeRiddle(settings));
    renderPages();
  });
  $('new').addEventListener('click', () => { readControls(); newAll(); });
  $('print').addEventListener('click', () => { readControls(); window.print(); });
  $('pages').addEventListener('click', (e) => {
    const b = e.target.closest('.reroll');
    if (!b) return;
    riddles[+b.dataset.i] = makeRiddle(settings);
    renderPages();
  });
  addEventListener('resize', fitPages);
  newAll();
}

/* ======== answer page ======== */
// the sheet solved: every box filled in, and a line along the path with an arrowhead at the treasure
function showAnswer(r) {
  document.body.classList.add('answering');
  const [ex, ey] = r.end;
  let [x, y] = r.start;
  const pts = [[cx(x), cx(y)]];
  for (const st of r.steps) { x += DIRS[st.d][0] * st.k; y += DIRS[st.d][1] * st.k; pts.push([cx(x), cx(y)]); }
  const last = DIRS[r.steps[r.steps.length - 1].d];
  const tip = [cx(ex) - last[0] * ARROW_GAP, cx(ey) - last[1] * ARROW_GAP];   // stop at the chest's edge
  const line = [...pts.slice(0, -1), tip].map((p) => p.join(',')).join(' ');
  // where each move ends, numbered like its card, so a path that doubles back can still be followed
  const turns = pts.slice(1, -1).map(([a, b], i) => `<g class="no" transform="translate(${a} ${b})"><circle r="2.7"/><text>${i + 1}</text></g>`).join('');
  const extra = `<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
      <path class="head" d="M0 0 10 5 0 10z"/></marker></defs>
    <g class="treasure"><rect class="spot" x="${M + ex * 10 + .6}" y="${M + ey * 10 + .6}" width="8.8" height="8.8" rx="1.5"/>
      <g transform="translate(${cx(ex) - 4.2} ${cx(ey) - 4.4}) scale(${8.4 / 24})">${CHEST}</g></g>
    <polyline class="path" points="${line}" marker-end="url(#head)"/>${turns}`;
  $('solved').innerHTML = `${boardSvg(r.n, r.start, 'board', extra)}
    <div class="side">
      <button class="found" type="button" aria-label="Open the treasure chest">${chestSvg('')}<span>${cellName(r.end)}</span></button>
      <ol class="steps">${r.steps.map((st, i) => stepCard(st, r.sums && r.sums[i], { answer: st.k, no: i + 1 })).join('')}</ol>
      <a id="make" href="./">Make new maps</a>
    </div>`;
  document.querySelector('.bigchest').innerHTML = `<rect x="3.2" y="8" width="17.6" height="3" rx=".5" fill="#2e1606"/><g class="lid">${CHEST_LID}</g>${CHEST_BODY}`;
  $('solved').addEventListener('click', (e) => { if (e.target.closest('.found, .treasure')) openChest(); });
  $('reward').addEventListener('click', closeChest);
}

/* ======== reward chest ======== */
let lastReward = -1, chestBusy = false, ac = null;

function openChest() {
  if (chestBusy) return;
  chestBusy = true;
  let i;
  do i = Math.floor(Math.random() * REWARDS.length); while (i === lastReward && REWARDS.length > 1);
  lastReward = i;
  const box = $('reward');
  box.querySelector('.emoji').textContent = REWARDS[i][0];
  box.querySelector('.name').textContent = REWARDS[i][1];
  for (const b of box.querySelectorAll('.bit')) b.remove();
  box.className = '';
  box.hidden = false;
  void box.offsetWidth;   // restart the animations when opened again
  box.classList.add('shake');
  rattle();
  setTimeout(() => {
    box.classList.add('open');
    tada();
    burst(box);
    setTimeout(() => { chestBusy = false; }, 700);   // so a quick second tap can't close it straight away
  }, CHEST_SHAKE_MS);
}

function closeChest() { if (!chestBusy) $('reward').hidden = true; }

function burst(box) {
  for (let i = 0; i < 26; i++) {
    const b = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 22 + Math.random() * 30;
    b.className = 'bit';
    b.textContent = BITS[i % BITS.length];
    b.style.setProperty('--dx', `${(Math.cos(a) * d).toFixed(1)}vmin`);
    b.style.setProperty('--dy', `${(Math.sin(a) * d - 12).toFixed(1)}vmin`);
    b.style.setProperty('--r', `${Math.round(Math.random() * 720 - 360)}deg`);
    b.style.animationDelay = `${Math.round(Math.random() * 150)}ms`;
    box.append(b);
  }
}

// synthesized sounds: a wooden rattle, then a fanfare with a sparkle on top
function audio() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch { ac = null; }
  return ac;
}
function tone(f, at, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(ac.destination);
  o.start(at); o.stop(at + dur + 0.05);
}
function rattle() {
  if (!audio()) return;
  const t = ac.currentTime;
  for (let i = 0; i < 5; i++) tone(150 + (i % 2) * 40, t + i * 0.09, 0.06, 'square', 0.07);
}
function tada() {
  if (!ac) return;
  const t = ac.currentTime;
  [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.09, i === 3 ? 0.7 : 0.18, 'triangle', 0.2));
  [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, t + 0.45 + i * 0.07, 0.3, 'sine', 0.06));
}

/* ======== start ======== */
function route() {
  const r = parseHash();
  if (r) showAnswer(r);
  else { document.body.classList.remove('answering'); if (!riddles.length) startMaker(); }
}
addEventListener('hashchange', () => location.reload());
route();
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// the QR library) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
</body>
</html>
